<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Glowing terminal prompt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="0.5" stop-color="#4c1d95"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.07">
    <path d="M0 60H800M0 120H800M0 180H800M0 240H800M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300"/>
  </g>
  <circle cx="680" cy="70" r="90" fill="#22d3ee" opacity="0.15"/>
  <circle cx="120" cy="250" r="120" fill="#a78bfa" opacity="0.15"/>
  <g filter="url(#glow)" font-family="Menlo, Consolas, monospace" font-size="56" font-weight="bold">
    <text x="220" y="170" fill="#5eead4">&gt;_</text>
    <text x="330" y="170" fill="#f5f3ff">hello</text>
    <rect x="510" y="128" width="28" height="50" fill="#5eead4"/>
  </g>
</svg>
